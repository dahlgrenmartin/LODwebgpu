name: Deploy demo to GitHub Pages

# One-time setup in the repository: Settings -> Pages -> Source = "GitHub Actions".
# Without that, this workflow builds successfully and deploys nothing.
#
# The model fixtures under web/public/models are expected to be committed. They
# are ~209 MB, and every regeneration adds another copy to history, so consider
# generating them in this workflow instead if the repository starts to hurt.
# Git LFS is NOT an alternative: Pages serves LFS pointer files as text.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # A project page is served from /<repo>/; a user/org page from /.
          # github.event.repository.name gives the former without hardcoding it.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Check model fixtures are present
        # vite silently copies an empty public/models if the fixtures are not in
        # the repo: the build stays green and every weight 404s on the live site.
        run: |
          missing=$(node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('public/models/manifest.json','utf8'));
            const need=[...m.resolutions.map(r=>r.graph), m.weights, m.encoder,
                        m.encoderWeights, 'lod_graph.json', 'lod_graph.weights.bin'];
            console.log(need.filter(f=>!fs.existsSync('public/models/'+f)).join(' '));
          ")
          if [ -n "$missing" ]; then
            echo "::error::model fixtures missing from the repo: $missing"; exit 1
          fi
          echo "all model fixtures present ($(du -sm public/models | cut -f1) MB)"

      - name: Check Pages limits
        run: |
          echo "dist size: $(du -sm dist | cut -f1) MB (site limit 1024 MB)"
          big=$(find dist -type f -size +99M -printf '%s %p\n' | sort -rn)
          if [ -n "$big" ]; then
            echo "::error::files over GitHub's 100 MB limit:"; echo "$big"; exit 1
          fi
          echo "no file exceeds 100 MB"
          test -f dist/models/manifest.json || {
            echo "::error::dist/models is empty - the published site would 404"; exit 1; }
          echo "dist/models populated: $(ls dist/models | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
