name: Deploy demo to GitHub Pages

# One-time setup in the repository: Settings -> Pages -> Source = "GitHub Actions".
# Without that, this workflow builds successfully and deploys nothing.
#
# The model fixtures under web/public/models are expected to be committed. They
# are ~209 MB, and every regeneration adds another copy to history, so consider
# generating them in this workflow instead if the repository starts to hurt.
# Git LFS is NOT an alternative: Pages serves LFS pointer files as text.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # A project page is served from /<repo>/; a user/org page from /.
          # github.event.repository.name gives the former without hardcoding it.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Check Pages limits
        run: |
          echo "dist size: $(du -sm dist | cut -f1) MB (site limit 1024 MB)"
          big=$(find dist -type f -size +99M -printf '%s %p\n' | sort -rn)
          if [ -n "$big" ]; then
            echo "::error::files over GitHub's 100 MB limit:"; echo "$big"; exit 1
          fi
          echo "no file exceeds 100 MB"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
